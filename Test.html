<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SuryaToko - E-Commerce</title>

    <link rel="stylesheet" href="Test.css">
</head>

<body>

    <!-- HEADER -->
    <header>
        <div class="container navbar">

            <div class="logo">
                Surya<span>Toko</span>
            </div>

            <div class="search">
                <input
                    type="text"
                    id="searchInput"
                    placeholder="Cari produk..."
                >
            </div>

            <button class="cart-btn" onclick="openCart()">
                🛒 Keranjang
                <span id="cartCount">0</span>
            </button>

        </div>
    </header>


    <!-- HERO -->
    <section class="hero">
        <div class="container">
            <h1>Belanja Mudah & Cepat</h1>
            <p>Temukan produk favoritmu dengan harga terbaik.</p>
        </div>
    </section>


    <!-- PRODUK -->
    <main class="container">

        <div class="section-title">
            <h2>Produk Kami</h2>
        </div>

        <div id="productList" class="products"></div>

    </main>


    <!-- CART -->
    <div id="cartModal" class="modal">

        <div class="cart">

            <div class="cart-header">
                <h2>Keranjang</h2>

                <button onclick="closeCart()">✕</button>
            </div>

            <div id="cartItems"></div>

            <div class="cart-footer">

                <h3>
                    Total:
                    <span id="cartTotal">Rp0</span>
                </h3>

                <button
                    class="checkout"
                    onclick="checkoutWhatsApp()"
                >
                    Checkout via WhatsApp
                </button>

            </div>

        </div>

    </div>


<footer>
    <div class="social-media">
        <h3>Ikuti Kami</h3>

        <div class="social-links">

            <a href="https://tiktok.com/me" target="_blank">
                TikTok
            </a>

            <a href="https://www.facebook.com/me" target="_blank"  class="a-contact">facebook</a>

            <a href="https://wa.me/081223223047" target="_blank">
                WhatsApp
            </a>

        </div>
    </div>

    <p>© 2026 SuryaToko.</p>
</footer>


    <script src="test.js"></script>

</body>
</html>
